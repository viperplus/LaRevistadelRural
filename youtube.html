<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>YouTube</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  iframe {
    position: absolute;
    top: 0; left: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<iframe
  src="https://www.youtube-nocookie.com/embed/4rQjONS8_rw?autoplay=1&mute=1&controls=0&loop=1&playlist=4rQjONS8_rw&rel=0&modestbranding=1&playsinline=1"
  title="YouTube video player"
  frameborder="0"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  referrerpolicy="strict-origin-when-cross-origin"
  allowfullscreen></iframe>
</body>
</html>
