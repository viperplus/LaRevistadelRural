<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Las Toninas</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  video { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; object-fit: contain; background: #000; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const URL_STREAM = "https://video5.estadodelmar.com.ar/mobile/toninas/index.m3u8";
const video = document.getElementById("v");
let hls = null;

function start() {
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  if (Hls.isSupported()) {
    hls = new Hls({
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 6,
      maxBufferLength: 12,
      backBufferLength: 10,
      manifestLoadingMaxRetry: Infinity,
      levelLoadingMaxRetry: Infinity,
      fragLoadingMaxRetry: Infinity
    });
    hls.loadSource(URL_STREAM);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try { hls.recoverMediaError(); } catch (e) { setTimeout(start, 3000); }
      } else {
        setTimeout(start, 5000);
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = URL_STREAM;
    video.addEventListener("loadedmetadata", () => video.play().catch(() => {}));
    video.addEventListener("error", () => setTimeout(start, 5000));
  }
}

let lastTime = 0, lastAdvance = Date.now();
setInterval(() => {
  const t = video.currentTime;
  if (!video.paused && t !== lastTime) { lastTime = t; lastAdvance = Date.now(); return; }
  if (Date.now() - lastAdvance > 8000) {
    lastAdvance = Date.now();
    if (hls && isFinite(hls.liveSyncPosition)) {
      try { video.currentTime = hls.liveSyncPosition; video.play().catch(() => {}); }
      catch (e) { start(); }
    } else {
      start();
    }
  }
}, 2000);

start();
</script>
</body>
</html>
