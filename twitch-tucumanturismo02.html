<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch - tucumanturismo02</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #twitch-embed {
      width: 100vw;
      height: 100vh;
    }
    #twitch-embed iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #fallback button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="twitch-embed"></div>

  <div id="fallback">
    <button onclick="window.open('https://www.twitch.tv/tucumanturismo02', '_blank')">
      Abrir canal en una ventana nueva
    </button>
  </div>

  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <script type="text/javascript">
    try {
      new Twitch.Player("twitch-embed", {
        channel: "tucumanturismo02",
        parent: ["localhost"],
        width: "100%",
        height: "100%"
      });
    } catch (e) {
      document.getElementById("twitch-embed").style.display = "none";
      document.getElementById("fallback").style.display = "flex";
    }
  </script>
</body>
</html>
